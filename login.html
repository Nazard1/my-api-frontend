<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Клювання — вхід</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="container header-inner">
                <a href="index.html" class="logo">Клювання</a>
                <nav class="nav">
                    <a href="index.html">Каталог</a>
                    <a href="add-product.html">Додати товар</a>
                    <span id="nav-user" class="nav-user"></span>
                </nav>
            </div>
        </header>
        <main class="container">
            <h1>Вхід</h1>
            <p id="registered" class="status success" hidden>Реєстрація успішна. Тепер увійдіть.</p>
            <form id="login-form" class="form" novalidate>
                <label for="username">Імʼя користувача</label>
                <input id="username" name="username" type="text" autocomplete="username">
                <label for="password">Пароль</label>
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password">
                <p class="form-error" hidden></p>
                <button type="submit" class="button">Увійти</button>
                <p class="form-hint">
                    Немає акаунта? <a href="register.html">Зареєструватися</a>
                </p>
            </form>
        </main>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
                integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
                crossorigin="anonymous"></script>
        <script src="auth.js"></script>
        <script src="login.js"></script>
    </body>
</html>
