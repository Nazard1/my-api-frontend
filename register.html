<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Клювання — реєстрація</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="container header-inner">
                <a href="index.html" class="logo">Клювання</a>
                <nav class="nav">
                    <a href="index.html">Каталог</a>
                    <a href="add-product.html">Додати товар</a>
                    <span id="nav-user" class="nav-user"></span>
                </nav>
            </div>
        </header>
        <main class="container">
            <h1>Реєстрація</h1>
            <form id="register-form" class="form" novalidate>
                <label for="username">Імʼя користувача *</label>
                <input id="username" name="username" type="text" autocomplete="username">
                <label for="first_name">Імʼя</label>
                <input id="first_name"
                       name="first_name"
                       type="text"
                       autocomplete="given-name">
                <label for="last_name">Прізвище</label>
                <input id="last_name"
                       name="last_name"
                       type="text"
                       autocomplete="family-name">
                <label for="email">Email *</label>
                <input id="email" name="email" type="email" autocomplete="email">
                <label for="password">Пароль *</label>
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="new-password">
                <label for="password2">Повторіть пароль *</label>
                <input id="password2"
                       name="password2"
                       type="password"
                       autocomplete="new-password">
                <p class="form-error" hidden></p>
                <button type="submit" class="button">Зареєструватися</button>
                <p class="form-hint">
                    Вже маєте акаунт? <a href="login.html">Увійти</a>
                </p>
            </form>
        </main>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
                integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
                crossorigin="anonymous"></script>
        <script src="auth.js"></script>
        <script src="register.js"></script>
    </body>
</html>
